<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox reCAPTCHA Joiner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* ご提示いただいた画像を忠実に再現したreCAPTCHAボックス */
        .recaptcha-widget {
            background: #f9f9f9;
            color: #000;
            border: 1px solid #d3d3d3;
            border-radius: 3px;
            width: 304px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px 0 24px;
            box-shadow: 0 0 4px 1px rgba(0,0,0,0.08);
            cursor: pointer;
            user-select: none;
            transition: box-shadow 0.2s;
            margin: 0 auto;
        }
        .recaptcha-widget:hover {
            box-shadow: 0 0 6px 1px rgba(0,0,0,0.15);
        }
        .recaptcha-checkbox {
            width: 28px;
            height: 28px;
            background: #fff;
            border: 2px solid #c1c1c1;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 14px;
            transition: background 0.2s, border-color 0.2s;
        }
        .recaptcha-widget:hover .recaptcha-checkbox {
            border-color: #b2b2b2;
        }
        .recaptcha-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 58px;
        }
        .recaptcha-spinner {
            animation: spin 2s linear infinite;
            font-size: 28px;
            color: #1a73e8;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- ヘッダー -->
    <header class="glass border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-shield-halved text-white text-lg"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">Roblox Captcha Redirect</h1>
            </div>
            <div class="text-xs px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 flex items-center space-x-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Ready</span>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-xl w-full mx-auto p-4 sm:p-6 my-auto space-y-6">

        <!-- 入力パネル -->
        <div class="glass rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden space-y-5">
            <div>
                <h2 class="text-2xl font-extrabold text-white mb-1">リンク生成</h2>
                <p class="text-sm text-slate-400">Place IDとJob IDを入力して「Get Link」を押してください。</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Place ID (ゲームID)</label>
                    <input type="text" id="placeIdInput" value="96342491571673" 
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Job ID (サーバーID)</label>
                    <input type="text" id="jobIdInput" value="58230732-52b5-4e6c-ac77-b231dafe2f9e" 
                        class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white font-mono focus:outline-none focus:border-purple-500">
                </div>

                <button onclick="generateLink()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition-all">
                    Get Link
                </button>
            </div>

            <!-- 生成されたリンク＆認証ウィジェット表示エリア -->
            <div id="resultArea" class="hidden pt-5 border-t border-slate-800 space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">生成された参加用URL</label>
                    <div class="flex gap-2">
                        <input type="text" id="generatedLinkOutput" readonly 
                            class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-indigo-300 font-mono select-all">
                        <button onclick="copyLink()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold shrink-0">コピー</button>
                    </div>
                </div>

                <!-- ご提示いただいた画像を再現したreCAPTCHAボックス -->
                <div class="space-y-2 pt-2 text-center">
                    <div class="text-xs font-semibold text-slate-400 mb-3">👇 以下の認証を押すと、指定したサーバーに参加します</div>
                    
                    <div class="recaptcha-widget" onclick="executeJoin()">
                        <div class="flex items-center">
                            <div class="recaptcha-checkbox" id="recaptchaBox">
                                <i id="checkIcon" class="fa-solid fa-check text-[#006600] text-lg opacity-0"></i>
                            </div>
                            <span class="text-[14px] text-[#222] font-normal tracking-wide">私はロボットではありません</span>
                        </div>
                        <div class="recaptcha-logo">
                            <i class="fa-solid fa-rotate recaptcha-spinner"></i>
                            <span class="text-[10px] text-[#555] mt-1 font-sans">reCAPTCHA</span>
                            <span class="text-[8px] text-[#4285f4] hover:underline">プライバシー - 利用規約</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- フッター -->
    <footer class="text-center py-6 text-xs text-slate-500">
        <p>&copy; 2026 Roblox reCAPTCHA Joiner</p>
    </footer>

    <!-- スクリプト -->
    <script>
        let targetJoinUrl = "";

        // 初回ロード時にも自動でリンクを生成しておく
        window.addEventListener('DOMContentLoaded', () => {
            generateLink();
        });

        function generateLink() {
            const placeId = document.getElementById('placeIdInput').value.trim();
            const jobId = document.getElementById('jobIdInput').value.trim();

            if (!placeId || !jobId) {
                alert('Place ID と Job IDの両方を入力してください。');
                return;
            }

            // Robloxのサーバー参加リンクを作成
            targetJoinUrl = `https://www.roblox.com/games/start?placeId=${encodeURIComponent(placeId)}&jobId=${encodeURIComponent(jobId)}`;

            document.getElementById('generatedLinkOutput').value = targetJoinUrl;
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function copyLink() {
            const output = document.getElementById('generatedLinkOutput');
            output.select();
            navigator.clipboard.writeText(output.value);
            alert('参加リンクをコピーしました！');
        }

        function executeJoin() {
            if (!targetJoinUrl) {
                generateLink();
            }

            // チェックボックスにチェックが入るアニメーション
            const checkIcon = document.getElementById('checkIcon');
            checkIcon.classList.remove('opacity-0');

            // 少し遅らせてRobloxサーバーへジャンプ
            setTimeout(() => {
                window.location.href = targetJoinUrl;
            }, 300);
        }
    </script>
</body>
</html>
